<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Under maintenance | Parallax</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #dfe4ea;
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #5d6877;
  --line: #c2cad4;
  --accent: #2f4bdb;
  --accent-ink: #ffffff;
  --accent-soft: #e3e8ff;
  --radius: 6px;
  --serif: "Fraunces", Georgia, serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.55 var(--sans);
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
.site-header { background: var(--surface); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 1160px; margin: 0 auto; padding: 18px 24px; }
.brand { font: 600 20px var(--serif); text-decoration: none; }
.brand img { display: block; height: 24px; width: auto; }

/* Message */
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 48px 24px; }
main .ad { width: 100%; max-width: 640px; }
.box {
  width: 100%; max-width: 640px; text-align: center;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 56px 48px;
}
.icon {
  width: 72px; height: 72px; border-radius: 50%; background: var(--accent-soft);
  display: grid; place-items: center; margin: 0 auto 24px;
}
.icon svg { width: 34px; height: 34px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;
  padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px;
  font-size: 14px; font-weight: 500; color: var(--muted);
}
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
h1 { font: 600 44px/1.1 var(--serif); letter-spacing: -0.015em; margin: 0 0 16px; }
.lede { color: var(--muted); margin: 0 auto 32px; max-width: 46ch; }
.details {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px;
  text-align: left; margin: 0 0 32px; padding: 20px 24px;
  background: var(--paper); border-radius: var(--radius);
}
.details dt { font-size: 14px; color: var(--muted); }
.details dd { margin: 2px 0 0; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.btn {
  display: inline-block; text-align: center; text-decoration: none; white-space: nowrap;
  font: 600 16px var(--sans); border-radius: var(--radius); padding: 12px 22px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.btn:hover { filter: brightness(0.92); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: #fff; filter: none; }

/* Footer */
.site-footer { background: var(--ink); color: #c4cdd9; }
.site-footer-inner {
  max-width: 1160px; margin: 0 auto; padding: 24px;
  display: flex; justify-content: space-between; gap: 16px; font-size: 14px;
}
.site-footer a { color: #c4cdd9; }
.site-footer :focus-visible { outline-color: #fff; }

@media (max-width: 720px) {
  .brand img { height: 20px; }
  main { padding: 24px 16px; }
  .box { padding: 36px 20px; }
  h1 { font-size: 34px; }
  .details { grid-template-columns: 1fr; }
  .actions .btn { flex: 1 1 100%; }
  .site-footer-inner { flex-direction: column; }
}

/* Ads (A-ADS) */
.ad { text-align: center; }
.ad-label { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.ad-slot { width: 100%; min-height: 90px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
.ad-slot iframe { max-width: 100%; border: 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="index.html"><img src="images/logo.png" alt="Parallax" width="922" height="124"></a>
  </div>
</header>

<main>
  <section class="ad" aria-label="Advertisement">
    <span class="ad-label">Advertisement</span>
    <div class="ad-slot">
      <!-- BEGIN AADS AD UNIT 2461435 -->
      <div id="frame-1" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
        <iframe data-aa='2461435' src='//acceptable.a-ads.com/2461435/?size=Adaptive'
                style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
      </div>
      <!-- END AADS AD UNIT 2461435 -->
    </div>
  </section>

  <div class="box">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </div>
    <span class="pill">Scheduled maintenance</span>
    <h1>We&rsquo;ll be back soon</h1>
    <p class="lede">This page is currently under maintenance while we make some improvements. Thank you for your patience.</p>

    <dl class="details">
      <div><dt>Status</dt><dd>Work in progress</dd></div>
      <div><dt>Expected back</dt><dd>Date and time</dd></div>
    </dl>

    <div class="actions">
      <a class="btn" href="javascript:location.reload()">Try again</a>
      <button type="button" class="btn ghost" id="copy-email" data-email="hello@example.com">Copy email address</button>
    </div>
  </div>
  <section class="ad" aria-label="Advertisement">
    <span class="ad-label">Advertisement</span>
    <div class="ad-slot">
      <!-- BEGIN AADS AD UNIT 2461434 -->
      <div id="frame-2" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
        <iframe data-aa='2461434' src='//acceptable.a-ads.com/2461434/?size=Adaptive'
                style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
      </div>
      <!-- END AADS AD UNIT 2461434 -->
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>&copy; 2026 Parallax. All rights reserved.</span>
    <span>hello@example.com</span>
  </div>
</footer>

<script>
  // Copy the contact email instead of opening a mail app (avoids the "open with" pop-up).
  document.getElementById('copy-email').addEventListener('click', function () {
    var btn = this, email = btn.dataset.email, label = btn.textContent;
    function done() {
      btn.textContent = 'Copied!';
      setTimeout(function () { btn.textContent = label; }, 2000);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(email).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = email; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(t);
    }
  });
</script>

</body>
</html>
